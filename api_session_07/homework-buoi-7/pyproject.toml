[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"
[project]
name = "soa-session7-product-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
 "Flask>=3.1,<3.2", "Flask-SQLAlchemy>=3.1.1,<3.2", "SQLAlchemy>=2.0.36,<2.1",
 "marshmallow>=4.0,<5", "flask-smorest>=0.46.1,<0.48", "Flask-Migrate>=4.1,<5",
 "psycopg[binary]>=3.2,<4", "gunicorn>=23,<24", "python-dotenv>=1,<2"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
