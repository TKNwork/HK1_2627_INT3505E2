services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soa
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: soa7
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soa -d soa7"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    image: soa-session7-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://soa:local-only-password@db:5432/soa7
    command: ["flask", "--app", "wsgi:app", "db", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: soa-session7-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://soa:local-only-password@db:5432/soa7
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 3
volumes:
  pgdata:
